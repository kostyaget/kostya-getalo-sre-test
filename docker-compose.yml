services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: mvp-app
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MIGRATIONS: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: mvp-queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=5", "--sleep=3"]
    env_file: .env
    environment:
      RUN_MIGRATIONS: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    container_name: mvp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/public:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - internal

  mysql:
    image: mysql:8.4
    container_name: mvp-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: mvp-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - internal

volumes:
  mysql-data:
  redis-data:

networks:
  internal:
    driver: bridge